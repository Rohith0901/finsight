line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905"]

[lint.isort]
known-first-party = ["finsight_api", "finsight_ml"]

[lint.per-file-ignores]
# Offline pipeline: long synthetic-data word lists and SMS templates.
"ml/**" = ["E501"]
