name: app
on:
  push:
    paths: ["app/**", "shared/**", "scripts/*android*", "scripts/build_app.sh", ".github/workflows/app.yml"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: sqlite3 for database tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Android project files
        run: |
          if [ ! -f android/settings.gradle.kts ] && [ ! -f android/settings.gradle ]; then
            flutter create --platforms=android --org com.finsight --project-name finsight .
          fi
          ../scripts/patch_android.sh android
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: finsight-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
